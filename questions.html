<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preguntas — genuino</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .level-intro { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: .5px solid var(--border); }
    .q-block { margin-bottom: 1.25rem; }
    .q-label { font-size: 13px; color: var(--text2); line-height: 1.65; margin-bottom: .625rem; }
    .q-label.genie {
      font-family: var(--serif);
      font-style: italic;
      font-size: 15px;
      color: var(--text);
      line-height: 1.75;
      background: var(--bg3);
      border: .5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: .875rem;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">genuino</a>
  <div class="nav-links">
    <a href="profile.html">perfil</a>
    <a href="learn.html">bitcoin</a>
  </div>
</nav>

<main class="page fade-up">
  <div id="app"></div>
</main>

<script>
let questions = null;
let profile   = null;
let answers   = {};
let currentLevel = 0;

async function init() {
  const [qRes, pRes] = await Promise.all([
    fetch('assets/questions.json'),
    fetch('assets/profile.json')
  ]);
  questions = await qRes.json();
  profile   = await pRes.json();
  renderLevel(0);
}

function renderLevel(idx) {
  currentLevel = idx;
  const total  = questions.levels.length;
  const level  = questions.levels[idx];
  const app    = document.getElementById('app');

  const dots = Array.from({length: total}, (_, i) =>
    `<div class="dot ${i <= idx ? 'done' : ''}"></div>`
  ).join('');

  let questionsHTML = level.questions.map(q => {
    const isGenie = q.id === 'q4_1';
    let inputHTML = '';

    if (q.type === 'open') {
      inputHTML = `<textarea id="${q.id}" rows="${isGenie ? 4 : 3}" placeholder="tu respuesta..."></textarea>`;
    } else if (q.type === 'select') {
      const opts = q.options.map(o =>
        `<option value="${o}">${o}</option>`
      ).join('');
      inputHTML = `<select id="${q.id}"><option value="">— elegí —</option>${opts}</select>`;
    }

    const labelClass = isGenie ? 'q-label genie' : 'q-label';

    return `
      <div class="q-block">
        <div class="${labelClass}">${q.text}</div>
        ${inputHTML}
      </div>
    `;
  }).join('');

  const isLast = idx === total - 1;
  const btnLabel = isLast ? 'Ver resultados →' : 'Siguiente nivel →';

  app.innerHTML = `
    <span class="tag">nivel ${level.id} de ${total}</span>
    <div class="progress">${dots}</div>
    <div class="level-intro">
      <h1 style="font-size:clamp(22px,4vw,32px)">${level.title}</h1>
      <p style="margin-top:.35rem; font-size:13px; color:var(--text3)">${level.desc}</p>
    </div>
    ${questionsHTML}
    <button class="btn primary" onclick="saveAndAdvance()">${btnLabel}</button>
    ${idx > 0 ? `<button class="btn" onclick="renderLevel(${idx-1})" style="margin-top:.5rem">← volver</button>` : ''}
  `;

  // Restore saved answers
  level.questions.forEach(q => {
    const el = document.getElementById(q.id);
    if (el && answers[q.id]) el.value = answers[q.id];
  });

  window.scrollTo(0, 0);
}

function saveAndAdvance() {
  const level = questions.levels[currentLevel];
  level.questions.forEach(q => {
    const el = document.getElementById(q.id);
    if (el) answers[q.id] = el.value;
  });

  if (currentLevel < questions.levels.length - 1) {
    renderLevel(currentLevel + 1);
  } else {
    // Save to sessionStorage and go to reveal
    sessionStorage.setItem('genuino_answers', JSON.stringify(answers));
    window.location.href = 'reveal.html';
  }
}

init();
</script>

</body>
</html>
