<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preguntas — genuino</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .level-intro { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: .5px solid var(--border); }
    .q-block { margin-bottom: 1.25rem; }
    .q-label { font-size: 13px; color: var(--text2); line-height: 1.65; margin-bottom: .625rem; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">genuino</a>
  <div class="nav-links">
    <a href="profile.html">perfil</a>
    <a href="learn.html">bitcoin</a>
  </div>
</nav>

<main class="page fade-up">
  <div id="app"></div>
</main>

<script>
let profile      = null;
let answers      = {};
let currentLevel = 0;

async function init() {
  const res = await fetch('assets/profile.json');
  profile = await res.json();
  renderLevel(0);
}

function renderLevel(idx) {
  currentLevel = idx;
  const total = profile.sets.length;
  const set   = profile.sets[idx];
  const app   = document.getElementById('app');

  const dots = Array.from({length: total}, (_, i) =>
    `<div class="dot ${i <= idx ? 'done' : ''}"></div>`
  ).join('');

  const questionsHTML = set.questions.map(q => {
    let inputHTML = '';
    if (q.type === 'open') {
      inputHTML = `<textarea id="${q.id}" rows="3" placeholder="tu respuesta..."></textarea>`;
    } else if (q.type === 'select') {
      const opts = q.options.map(o =>
        `<option value="${o}">${o}</option>`
      ).join('');
      inputHTML = `<select id="${q.id}"><option value="">— elegí —</option>${opts}</select>`;
    }
    return `
      <div class="q-block">
        <div class="q-label">${q.text}</div>
        ${inputHTML}
      </div>
    `;
  }).join('');

  const isLast   = idx === total - 1;
  const btnLabel = isLast ? 'Ver resultados →' : 'Siguiente →';

  app.innerHTML = `
    <span class="tag">nivel ${idx + 1} de ${total}</span>
    <div class="progress">${dots}</div>
    <div class="level-intro">
      <h1 style="font-size:clamp(22px,4vw,32px)">${set.title}</h1>
      <p style="margin-top:.35rem; font-size:13px; color:var(--text3)">${set.desc}</p>
    </div>
    ${questionsHTML}
    <button class="btn primary" onclick="saveAndAdvance()">${btnLabel}</button>
    ${idx > 0 ? `<button class="btn" onclick="renderLevel(${idx-1})" style="margin-top:.5rem">← volver</button>` : ''}
  `;

  set.questions.forEach(q => {
    const el = document.getElementById(q.id);
    if (el && answers[q.id]) el.value = answers[q.id];
  });

  window.scrollTo(0, 0);
}

function saveAndAdvance() {
  const set = profile.sets[currentLevel];
  set.questions.forEach(q => {
    const el = document.getElementById(q.id);
    if (el) answers[q.id] = el.value;
  });

  if (currentLevel < profile.sets.length - 1) {
    renderLevel(currentLevel + 1);
  } else {
    sessionStorage.setItem('genuino_answers', JSON.stringify(answers));
    window.location.href = 'reveal.html';
  }
}

init();
</script>

</body>
</html>
