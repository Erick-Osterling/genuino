<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado — genuino</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">genuino</a>
  <div class="nav-links">
    <a href="profile.html">perfil</a>
    <a href="learn.html">bitcoin</a>
  </div>
</nav>

<main class="page fade-up">

  <span class="tag">comparación</span>
  <h1>Las respuestas juntas.</h1>
  <p style="margin:.5rem 0 2rem; font-style:italic; font-family:var(--serif)">Sin edición. Sin filtros.</p>

  <div id="compare-section"></div>

  <div class="divider"></div>

  <span class="tag">en común</span>
  <div style="margin: 1.25rem 0 1rem">
    <div class="score-big" id="score-num">—</div>
    <div class="score-sub">cosas en común</div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
  </div>

  <div class="card" id="score-card">
    <span class="tag">lectura</span>
    <p id="score-msg" style="color:var(--text); font-size:14px; line-height:1.75"></p>
  </div>

  <div class="card">
    <span class="tag">contacto directo</span>
    <p style="margin-bottom:.75rem">Sin plataformas, sin intermediarios. Si algo te resonó, escribile directo.</p>
    <div class="copy-row" onclick="copyMail()">
      <span id="mail-txt">pedro@proton.me — click para copiar</span>
    </div>
  </div>

  <a href="index.html" class="btn" style="margin-top:.5rem">← volver al inicio</a>

</main>

<script>
async function init() {
  const answersRaw = sessionStorage.getItem('genuino_answers');
  if (!answersRaw) {
    window.location.href = 'questions.html';
    return;
  }
  const myAnswers = JSON.parse(answersRaw);

  const [qRes, pRes] = await Promise.all([
    fetch('assets/questions.json'),
    fetch('assets/profile.json')
  ]);
  const qData   = await qRes.json();
  const profile = await pRes.json();

  const profileAnswers = {};
  profile.sets.forEach(set => set.questions.forEach(q => { profileAnswers[q.id] = q.answer; }));

  sessionStorage.setItem('genuino_profile_unlocked', '1');

  buildCompare(profile, profileAnswers, myAnswers);
  calcScore(profile, profileAnswers, myAnswers);
}

function buildCompare(profile, profileAnswers, myAnswers) {
  const container = document.getElementById('compare-section');

  profile.sets.forEach((set, idx) => {
    const block = document.createElement('div');
    block.style.cssText = 'margin-bottom:1.5rem';
    block.innerHTML = `
      <div style="margin-bottom:.75rem; padding-bottom:.4rem; border-bottom:.5px solid var(--border)">
        <span class="tag" style="margin-bottom:.2rem">nivel ${idx + 1}</span>
        <h2 style="font-size:16px">${set.title}</h2>
      </div>
    `;

    set.questions.forEach(q => {
      const profileAns = profileAnswers[q.id] || '—';
      const userAns    = myAnswers[q.id] || '(sin respuesta)';

      const qLabel = q.text.length > 80 ? q.text.substring(0, 80) + '…' : q.text;

      block.innerHTML += `
        <div style="margin-bottom:10px">
          <div class="tag" style="margin-bottom:6px">${qLabel}</div>
          <div class="pair">
            <div class="pair-side">
              <div class="pair-who">${profile.name}</div>
              <div class="pair-val">${profileAns}</div>
            </div>
            <div class="pair-side">
              <div class="pair-who">Tú</div>
              <div class="pair-val">${userAns}</div>
            </div>
          </div>
        </div>
      `;
    });

    container.appendChild(block);
  });
}

function calcScore(profile, profileAnswers, myAnswers) {
  let matches = 0;
  let selectTotal = 0;
  let hasOpenAnswers = 0;

  profile.sets.forEach(set => {
    set.questions.forEach(q => {
      if (q.type === 'select') {
        selectTotal++;
        if (myAnswers[q.id] && myAnswers[q.id] === profileAnswers[q.id]) matches++;
      }
      if (q.type === 'open' && myAnswers[q.id] && myAnswers[q.id].length > 15) {
        hasOpenAnswers++;
      }
    });
  });

  const selectScore  = selectTotal > 0 ? (matches / selectTotal) * 60 : 0;
  const openBonus    = Math.min(hasOpenAnswers * 5, 30);
  const baseScore    = 10;
  let score = Math.round(baseScore + selectScore + openBonus);
  score = Math.min(score, 99);

  document.getElementById('score-num').textContent = score + '%';
  setTimeout(() => {
    document.getElementById('bar-fill').style.width = score + '%';
  }, 150);

  let msg = '';
  if (score >= 75) {
    msg = 'Bastante en común. No solo en gustos — en cómo ven el día a día y lo que les importa. Vale la pena seguir la conversación.';
  } else if (score >= 50) {
    msg = 'Algunas cosas en común, otras no tanto. A veces eso hace la conversación más interesante que la coincidencia total.';
  } else {
    msg = 'Mundos bastante distintos. Pero eso también dice algo — y las diferencias a veces son lo más interesante.';
  }
  document.getElementById('score-msg').textContent = msg;
}

function copyMail() {
  navigator.clipboard.writeText('pedro@proton.me').catch(() => {});
  const el = document.getElementById('mail-txt');
  el.textContent = '✓ copiado';
  setTimeout(() => { el.textContent = 'pedro@proton.me — click para copiar'; }, 1800);
}

init();
</script>

</body>
</html>
